<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 시험용 사이트: 검색 엔진에 싣지 않음. 정식 사이트로 옮길 때 이 줄을 지울 것 -->
<meta name="robots" content="noindex">
<title>현대 우주론의 정립</title>
<style>
/* expansion.html과 같은 규칙
   색: 남색 하나를 기본 강조색으로 / 상자: 옅은 회색 판 / 모서리: 판 14px, 버튼 10px / 그림판: 밤하늘 남색 */
:root{--bg:#fff;--fg:#1b1f2a;--card:#f3f4f8;--bd:#d5d8e2;--bline:#d9d9d6;--bcard:#fff;--bfg:#1c1c1c;--acc:#5468d4;--acc-bg:#eef0fc;--acc-bd:#c3caf2;--on-acc:#fff;--frame:transparent;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--fg:#e8eaf2;--card:#1f222c;--bd:#3a3f50;--bline:#3a3a38;--bcard:#262625;--bfg:#eee;--acc:#8f9cf0;--acc-bg:#1e2340;--acc-bd:#3d4680;--on-acc:#10142b;--frame:#2c3247}}
:root[data-theme="dark"]{--bg:#14161d;--fg:#e8eaf2;--card:#1f222c;--bd:#3a3f50;--bline:#3a3a38;--bcard:#262625;--bfg:#eee;--acc:#8f9cf0;--acc-bg:#1e2340;--acc-bd:#3d4680;--on-acc:#10142b;--frame:#2c3247}
/* 탭 안에서 고르는 단추는 라벤더(연보라) (위쪽 큰 탭의 남색과 구분) */
:root{--sub:#7c5cd6;--on-sub:#fff;--sub-bg:#efeafd;--sub-bd:#cdbff3;--sub-tx:#5b3fbf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sub:#b9a6ff;--on-sub:#1e1640;--sub-bg:#221c3a;--sub-bd:#4a3f80;--sub-tx:#cbbcff}}
:root[data-theme="dark"]{--sub:#b9a6ff;--on-sub:#1e1640;--sub-bg:#221c3a;--sub-bd:#4a3f80;--sub-tx:#cbbcff}
/* 기억하기(꼭 기억할 내용) 꼬리표: 생각해 보기(남색)와 구분되는 주황색 */
:root{--mem:#c2620a;--on-mem:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mem:#ffb357;--on-mem:#2a1600}}
:root[data-theme="dark"]{--mem:#ffb357;--on-mem:#2a1600}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.5;word-break:keep-all}
button,input{font-family:inherit}
main{max-width:960px;margin:0 auto;padding:14px}
/* 제목 줄: 제목 …… [← 돌아가기] (좁은 화면에서는 줄바꿈) */
.titlebar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:0 0 8px}
.pnum{margin:0;flex:none;padding:2px 10px;border-radius:999px;background:var(--acc);color:var(--on-acc);font-size:.8rem;font-weight:700;letter-spacing:.04em}
.titlebar h1{font-size:1.35rem;font-weight:800;line-height:1.35;margin:0;text-wrap:balance}
.back{margin:0 0 0 auto;flex:none;display:inline-block;padding:8px 14px;border:1px solid var(--bline);border-radius:999px;background:var(--bcard);color:var(--bfg);font-size:.9rem;font-weight:700;text-decoration:none}
.back:hover{background:var(--bline)}
/* 학습 메뉴 탭 (expansion.html과 같은 모양) */
/* 탭 6개: 넓은 화면은 한 줄, 패드 세로 화면은 3개씩 두 줄, 휴대폰은 2개씩 세 줄 (한 탭만 따로 남지 않게) */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 10px}
@media (max-width:860px){.tabs{grid-template-columns:repeat(3,1fr)}}
@media (max-width:480px){.tabs{grid-template-columns:repeat(2,1fr)}}
.tabs button{padding:9px 8px;font-size:.95rem;line-height:1.3;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}
.note{margin-bottom:8px;background:var(--card);border-radius:14px;padding:8px 14px;font-size:.92rem}
.note p{margin:0}
/* 탭을 바꿀 때 내용이 살짝 떠오르며 나타남 */
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.enter{animation:enter .28s ease-out}
@media (prefers-reduced-motion:reduce){.enter{animation:none}}
/* 그림판: 패드에서도 한 화면에 들어오도록 높이를 화면 높이에 맞춰 제한 */
svg{width:100%;height:auto;display:block;border-radius:14px;background:#0b1026;box-shadow:0 0 0 1px var(--frame)}
section svg{max-height:max(300px,calc(100vh - 300px))}
section svg{max-height:max(300px,calc(100dvh - 300px))}
/* 그림 아래 조작 줄 */
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px;padding:8px 12px;border-radius:14px;background:var(--card);min-height:50px}
.pb{padding:6px 14px;border:1px solid var(--acc);border-radius:10px;background:var(--acc);color:var(--on-acc);font-size:.9rem;font-weight:700;cursor:pointer;flex:none}
.pb:disabled{opacity:.4;cursor:default}
/* 학생에게 할 일을 알려 주는 말: 실행 단추와 같은 남색 굵은 글씨로 설명과 구분 */
.go{color:var(--acc);font-weight:700}
/* 글 속의 단추 이름 꼬리표: 실제 단추와 같은 색의 작은 상자 (.kb 실행 단추=남색, .kb.sub 선택 단추=연보라) */
.kb{display:inline-block;padding:0 .45em;margin:0 .1em;border-radius:6px;background:var(--acc);color:var(--on-acc);font-size:.9em;font-weight:700;line-height:1.55;vertical-align:.05em;white-space:nowrap}
.kb.sub{background:var(--sub-bg);color:var(--sub-tx);border:1px solid var(--sub-bd)}
/* 생각해 보기: 한 줄에 [꼬리표(남색)] 질문 [정답 확인(흰 바탕, 파란 글씨·테두리)] → 누르면 팝업에 질문과 답 */
.note.ask{margin:10px 0 0;padding:0;border-radius:0;background:none;display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;font-size:.95rem}
.note.ask p{margin:0;font-weight:600}
.ask2{margin-top:6px!important}
.tag{display:inline-block;flex:none;padding:2px 10px;border-radius:999px;background:var(--acc);color:var(--on-acc);font-size:.8rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.tag.mem{background:var(--mem);color:var(--on-mem)}
.memo .mtx{margin:0;font-weight:700;color:var(--mem);font-size:.95rem}
.open-think{padding:4px 12px;font-size:.85rem;font-weight:700;border:1px solid var(--acc);border-radius:10px;background:var(--bg);color:var(--acc);cursor:pointer;flex:none;font-family:inherit}
.open-think:hover{background:var(--card)}
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,14,25,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none}
.think{background:var(--bg);color:var(--fg);width:min(680px,100%);max-height:100%;overflow:auto;padding:14px 18px;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.think-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.think-t{display:flex;align-items:center;gap:8px;color:var(--acc);font-size:1rem}
.think .x{flex:none;font-size:.85rem;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:3px 10px;cursor:pointer;color:var(--fg);font-family:inherit}
.think .ans{margin:0 0 8px;font-size:1rem;font-weight:700}
.think .exp{margin:0;font-size:.93rem;line-height:1.6}
.think .exp+.exp{margin-top:6px}
</style>
<!-- 글꼴(Pretendard): 인터넷이 없으면 시스템 글꼴로 대신 표시되며 기능에는 영향 없음 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></head><body><main>
<!-- 학습실과 탐구 번호가 정해지면 제목 앞에 <p class="pnum">탐구 NN</p>을 넣고, 돌아가기 링크를 그 학습실 메뉴로 바꿀 것 -->
<div class="titlebar"><h1>현대 우주론의 정립</h1><a class="back" href="./index.html">← Earth Test Lab</a></div>
<div class="tabs" role="tablist" aria-label="학습 메뉴">
 <button role="tab" id="tab1" aria-controls="p1" aria-selected="true">현대 우주론</button>
 <button role="tab" id="tab2" aria-controls="p2" aria-selected="false" tabindex="-1">빅뱅 우주론의 증거</button>
 <button role="tab" id="tab3" aria-controls="p3" aria-selected="false" tabindex="-1">빅뱅 우주론의 문제점</button>
 <button role="tab" id="tab4" aria-controls="p4" aria-selected="false" tabindex="-1">급팽창 이론</button>
 <button role="tab" id="tab5" aria-controls="p5" aria-selected="false" tabindex="-1">암흑 물질의 발견</button>
 <button role="tab" id="tab6" aria-controls="p6" aria-selected="false" tabindex="-1">우주의 가속 팽창</button>
</div>

<!-- ① 현대 우주론 (준비 중) -->
<section id="p1" role="tabpanel" aria-labelledby="tab1">
 <div class="note"><p>정상 우주론과 빅뱅 우주론을 비교해 봅시다. (준비 중)</p></div>
 <svg viewBox="0 0 940 300" aria-label="준비 중인 그림판"><text x="470" y="158" text-anchor="middle" fill="#a9b1cc" font-size="18">현대 우주론 — 준비 중</text></svg>
</section>

<!-- ② 빅뱅 우주론의 증거 (준비 중) -->
<section id="p2" role="tabpanel" aria-labelledby="tab2" hidden>
 <div class="note"><p>빅뱅 우주론을 뒷받침하는 증거를 살펴봅시다. (준비 중)</p></div>
 <svg viewBox="0 0 940 300" aria-label="준비 중인 그림판"><text x="470" y="158" text-anchor="middle" fill="#a9b1cc" font-size="18">빅뱅 우주론의 증거 — 준비 중</text></svg>
</section>

<!-- ③ 빅뱅 우주론의 문제점 (준비 중) -->
<section id="p3" role="tabpanel" aria-labelledby="tab3" hidden>
 <div class="note"><p>빅뱅 우주론으로 설명하기 어려운 문제를 알아봅시다. (준비 중)</p></div>
 <svg viewBox="0 0 940 300" aria-label="준비 중인 그림판"><text x="470" y="158" text-anchor="middle" fill="#a9b1cc" font-size="18">빅뱅 우주론의 문제점 — 준비 중</text></svg>
</section>

<!-- ④ 급팽창 이론 (준비 중) -->
<section id="p4" role="tabpanel" aria-labelledby="tab4" hidden>
 <div class="note"><p>급팽창 이론이 빅뱅 우주론의 문제를 어떻게 해결하는지 알아봅시다. (준비 중)</p></div>
 <svg viewBox="0 0 940 300" aria-label="준비 중인 그림판"><text x="470" y="158" text-anchor="middle" fill="#a9b1cc" font-size="18">급팽창 이론 — 준비 중</text></svg>
</section>

<!-- ⑤ 암흑 물질의 발견 (준비 중) -->
<section id="p5" role="tabpanel" aria-labelledby="tab5" hidden>
 <div class="note"><p>암흑 물질이 있다는 것을 어떻게 알게 되었는지 알아봅시다. (준비 중)</p></div>
 <svg viewBox="0 0 940 300" aria-label="준비 중인 그림판"><text x="470" y="158" text-anchor="middle" fill="#a9b1cc" font-size="18">암흑 물질의 발견 — 준비 중</text></svg>
</section>

<!-- ⑥ 우주의 가속 팽창 (준비 중) -->
<section id="p6" role="tabpanel" aria-labelledby="tab6" hidden>
 <div class="note"><p>우주의 팽창 속도가 빨라지고 있다는 것과 암흑 에너지를 알아봅시다. (준비 중)</p></div>
 <svg viewBox="0 0 940 300" aria-label="준비 중인 그림판"><text x="470" y="158" text-anchor="middle" fill="#a9b1cc" font-size="18">우주의 가속 팽창 — 준비 중</text></svg>
</section>
</main>

<script>
// 학습 메뉴 탭 (expansion.html과 같은 방식: 왼쪽·오른쪽 화살표 키로도 이동)
const TABS=[tab1,tab2,tab3,tab4,tab5,tab6],PANES=[p1,p2,p3,p4,p5,p6];
function openTab(i){TABS.forEach((t,j)=>{t.setAttribute('aria-selected',i==j);t.tabIndex=i==j?0:-1;PANES[j].hidden=i!=j});
 PANES[i].classList.remove('enter');void PANES[i].offsetWidth;PANES[i].classList.add('enter')}
TABS.forEach((t,i)=>{t.onclick=()=>openTab(i);t.onkeydown=e=>{if(e.key=='ArrowRight'||e.key=='ArrowLeft'){const j=(i+(e.key=='ArrowRight'?1:TABS.length-1))%TABS.length;TABS[j].focus();openTab(j)}}});
</script>
<script src="./copyright.js"></script>
</body>
</html>
