<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 시험용 사이트: 검색 엔진에 싣지 않음. 정식 사이트로 옮길 때 이 줄을 지울 것 -->
<meta name="robots" content="noindex">
<title>H-R 도 상의 별의 분류</title>
<style>
/* 정식 사이트 '별의 물리량' 학습실 자료(spectrum.html, luminosity.html)와 같은 규칙
   색: 남색 하나를 기본 강조색으로, 온도 값은 호박색 / 상자: 옅은 회색 판 / 모서리: 판 14px, 버튼 10px / 그림판: 밤하늘 남색 */
:root{--bg:#fff;--fg:#1b1f2a;--card:#f3f4f8;--bd:#d5d8e2;--bline:#d9d9d6;--bcard:#fff;--bfg:#1c1c1c;--acc:#5468d4;--acc-bg:#eef0fc;--acc-bd:#c3caf2;--on-acc:#fff;--en:#b36b00;--frame:transparent;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--fg:#e8eaf2;--card:#1f222c;--bd:#3a3f50;--bline:#3a3a38;--bcard:#262625;--bfg:#eee;--acc:#8f9cf0;--acc-bg:#1e2340;--acc-bd:#3d4680;--on-acc:#10142b;--en:#f5b942;--frame:#2c3247}}
:root[data-theme="dark"]{--bg:#14161d;--fg:#e8eaf2;--card:#1f222c;--bd:#3a3f50;--bline:#3a3a38;--bcard:#262625;--bfg:#eee;--acc:#8f9cf0;--acc-bg:#1e2340;--acc-bd:#3d4680;--on-acc:#10142b;--en:#f5b942;--frame:#2c3247}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.5;word-break:keep-all}
button,input{font-family:inherit}
main{max-width:960px;margin:0 auto;padding:14px}
/* 제목 줄: [탐구 NN] 제목 …… [← 메뉴로 돌아가기] (좁은 화면에서는 줄바꿈) */
.titlebar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin:0 0 10px}
.pnum{margin:0;flex:none;padding:2px 10px;border-radius:999px;background:var(--acc);color:var(--on-acc);font-size:.8rem;font-weight:700;letter-spacing:.04em}
.titlebar h1{font-size:1.35rem;font-weight:800;line-height:1.35;margin:0;text-wrap:balance}
.back{margin:0 0 0 auto;flex:none;display:inline-block;padding:8px 14px;border:1px solid var(--bline);border-radius:999px;background:var(--bcard);color:var(--bfg);font-size:.9rem;font-weight:700;text-decoration:none}
.back:hover{background:var(--bline)}
/* 무리 고르기 탭 */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.tabs button{min-width:0;padding:8px 6px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font-size:.95rem;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button i{width:11px;height:11px;border-radius:3px;flex:none}
.tabs button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:700}
@media (max-width:640px){.tabs{grid-template-columns:repeat(2,1fr)}.tabs button:first-child{grid-column:span 2}}
.note{margin-bottom:10px;background:var(--card);border-radius:14px;padding:10px 14px;font-size:.92rem;min-height:5.2em}
.note .nh{font-weight:700;color:var(--acc)}
.note p{margin:4px 0 0}
.note .ex{opacity:.8;font-size:.88rem}
/* 탭을 바꿀 때 설명이 살짝 떠오르며 나타남 */
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.enter{animation:enter .28s ease-out}
@media (prefers-reduced-motion:reduce){.enter{animation:none}}
/* H-R도 그림판: 패드처럼 세로가 짧은 화면에서도 한 화면에 들어오도록 높이를 화면 높이에 맞춰 제한
   (위아래의 제목·탭·설명 칸이 약 290px) */
.fig{position:relative}
svg{width:100%;height:auto;display:block;border-radius:14px;background:#0b1026;box-shadow:0 0 0 1px var(--frame)}
#sv{max-height:max(300px,calc(100vh - 290px))}
#sv{max-height:max(300px,calc(100dvh - 290px))}
.ov{position:absolute;top:8px;right:10px}
.ov label{display:flex;align-items:center;gap:6px;font-size:.85rem;padding:4px 10px;border:1px solid #3a4260;border-radius:8px;background:#161c36cc;color:#e8eaf2;cursor:pointer}
@media (max-width:640px){.ov{top:4px;right:5px}.ov label{font-size:.62rem;padding:1px 6px;gap:4px}.ov input{width:11px;height:11px;margin:0}}
.sm{font-size:.78rem;opacity:.7;margin:6px 2px 0}
</style>
<!-- 글꼴(Pretendard): 인터넷이 없으면 시스템 글꼴로 대신 표시되며 기능에는 영향 없음 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></head><body><main>
<div class="titlebar"><p class="pnum">탐구 02</p><h1>H-R 도 상의 별의 분류</h1><a class="back" href="./index.html">← [Earth Test Lab] 메뉴로 돌아가기</a></div>

<div class="tabs" id="tabs"></div>
<div class="note" id="note"></div>
<div class="fig"><svg id="sv" viewBox="0 0 900 600"></svg>
 <div class="ov"><label><input type="checkbox" id="rad"> 반지름이 같은 선</label></div></div>
<p class="sm">점들은 실제 별들의 분포를 본뜬 예시입니다. 절대등급은 광도로부터 환산한 값(태양 = +4.8등)입니다.</p>

<script>
const NS="http://www.w3.org/2000/svg",sv=document.getElementById('sv');
// 그림판 좌표: 가로 = log(표면 온도) (왼쪽이 고온), 세로 = log(광도, 태양 = 1). 왼쪽 축은 절대등급, 오른쪽 축은 광도
const X0=74,X1=810,Y0=44,Y1=500,TA=4.75,TB=3.38,LA=6.5,LB=-4.5;
const xOf=t=>X0+(TA-t)/(TA-TB)*(X1-X0),yOf=l=>Y0+(LA-l)/(LA-LB)*(Y1-Y0);
const MSUN=4.83,lg=Math.log10,TSUN=lg(5772);
let G='all';
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||sv).appendChild(e);return e}
function lab(x,y,t,fs=15,an='middle',fill='#cfd6ea',w=600){const e=el('text',{x,y,fill,'font-size':fs,'text-anchor':an,'font-weight':w,stroke:'#0b1026','stroke-width':3,'paint-order':'stroke'});e.textContent=t;return e}
// 무리 (주계열성, 거성, 초거성, 백색왜성)
const GR={
ms:{n:'주계열성',c:'#7fb4ff',d:'H-R 도의 왼쪽 위에서 오른쪽 아래로 길게 이어진 띠에 있는 별들입니다. 별의 약 90%가 여기에 속하며, 중심부에서 수소 핵융합 반응이 일어나고 있습니다. 왼쪽 위에 있을수록 표면 온도가 높고 광도가 크며, 질량도 큽니다.',ex:'태양, 시리우스 A, 레굴루스, 프록시마 센타우리'},
g:{n:'거성',c:'#ffb86b',d:'주계열의 오른쪽 위에 있는 별들입니다. 표면 온도가 낮아 주로 붉은색을 띠지만, 반지름이 태양의 수십 배 정도로 커서 광도가 큽니다. 그래서 적색 거성이라고도 합니다.',ex:'아크투루스, 알데바란, 폴룩스'},
sg:{n:'초거성',c:'#ff7a8a',d:'H-R 도의 가장 위쪽에 있는 별들입니다. 반지름이 매우 커서 광도가 매우 큽니다. 예를 들어 베텔게우스의 반지름은 태양의 수백 배에 이릅니다.',ex:'베텔게우스, 리겔, 데네브'},
wd:{n:'백색왜성',c:'#e6ecff',d:'H-R 도의 왼쪽 아래에 있는 별들입니다. 표면 온도는 높지만 반지름이 지구 정도로 매우 작아서 광도가 작습니다.',ex:'시리우스 B, 프로키온 B'}};
const ALL='H-R 도에서 별들은 고르게 흩어져 있지 않고 몇 개의 무리로 모여 있습니다. 위의 탭에서 무리를 골라 위치와 특징을 확인해 보세요.';
const ASK='<p><b>생각해 보기</b> 거성과 백색왜성 중 표면 온도가 높은 쪽은? 광도가 큰 쪽은? 그 차이를 만드는 것은 무엇일까요? (‘반지름이 같은 선’을 켜 보세요.)</p>';
// 주계열의 대략적인 위치 [log T, log L]
const MS=[[4.65,5.7],[4.6,5.3],[4.5,4.5],[4.4,3.8],[4.3,3.2],[4.2,2.7],[4.1,2.1],[4.0,1.5],[3.9,1.0],[3.86,.75],[3.8,.3],[3.761,0],[3.7,-.45],[3.65,-.85],[3.6,-1.15],[3.55,-1.6],[3.5,-2.4],[3.45,-3.2],[3.42,-3.6]];
const msL=t=>{for(let i=1;i<MS.length;i++)if(t>=MS[i][0]){const[a,b]=MS[i-1],[c,d]=MS[i];return d+(b-d)*(t-c)/(a-c)}return MS[MS.length-1][1]};
const wdL=t=>4*t-18.85; // 반지름이 거의 같은 백색왜성: L ∝ T⁴
// 무리 영역 (log T, log L 다각형)
function band(f,t0,t1,up,dn){const a=[],b=[];for(let t=t0;t>=t1-1e-9;t-=.02){a.push([t,f(t)+up]);b.unshift([t,f(t)-dn])}return a.concat(b)}
const REG={ms:band(msL,4.66,3.42,.55,.4),wd:band(wdL,4.5,3.8,.4,.4),
 g:[[3.75,.9],[3.73,1.9],[3.66,2.9],[3.57,3.5],[3.5,3.4],[3.53,2.4],[3.6,1.6],[3.68,1.0]],
 sg:[[4.6,6.2],[3.47,6.0],[3.47,4.2],[3.8,4.15],[4.3,4.5],[4.6,5.3]]};
const RL={ms:[3.98,.25],g:[3.69,.5],sg:[4.05,5.85],wd:[4.12,-3.35]};
// 별의 색 (표면 온도에 따라, 구분하기 쉽도록 조금 진하게)
const SC=[[4.6,[155,176,255]],[4.3,[170,191,255]],[4.0,[202,215,255]],[3.875,[248,247,255]],[3.78,[255,244,226]],[3.716,[255,229,180]],[3.6,[255,200,130]],[3.48,[255,160,100]]];
const css=c=>`rgb(${c.map(Math.round).join(',')})`;
function col(t){if(t>=SC[0][0])return css(SC[0][1]);for(let i=1;i<SC.length;i++)if(t>=SC[i][0]){const[a,p]=SC[i-1],[b,q]=SC[i],f=(t-b)/(a-b);return css(q.map((v,k)=>v+(p[k]-v)*f))}return css(SC[SC.length-1][1])}
// 일반적인 별들 (분포를 본뜬 예시, 'H-R 도란?'과 같은 고정된 난수 사용)
let seed=20261101;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296},gs=()=>Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(2*Math.PI*rnd());
const PTS=[];
for(let i=0;i<430;i++){const t=3.43+1.18*Math.pow(rnd(),1.7);PTS.push([t,msL(t)+.16*gs()+.25*rnd(),'ms'])}
for(let i=0;i<95;i++){const t=3.55+.18*rnd();PTS.push([t,1.6+(3.72-t)*8+.25*gs(),'g'])}
for(let i=0;i<30;i++){const t=3.66+.03*gs();PTS.push([t,1.7+.15*gs(),'g'])}
for(let i=0;i<34;i++){const t=3.5+1.0*rnd();PTS.push([t,4.4+1.3*rnd(),'sg'])}
for(let i=0;i<45;i++){const t=3.82+.62*rnd();PTS.push([t,wdL(t)+.18*gs(),'wd'])}
// 대표적인 별 [이름, 표면 온도 K, 광도(태양 = 1), 무리, 이름표를 왼쪽에 둘지]
const ST=[['태양',5772,1,'ms'],['시리우스 A',9940,25.4,'ms'],['레굴루스',12460,288,'ms'],['프록시마 센타우리',3040,.0017,'ms'],
['아크투루스',4290,170,'g',1],['알데바란',3900,440,'g'],['폴룩스',4670,33,'g',1],
['베텔게우스',3600,100000,'sg'],['리겔',12100,120000,'sg'],['데네브',8500,200000,'sg'],
['시리우스 B',25000,.056,'wd'],['프로키온 B',7740,.00049,'wd']];
// 분광형 경계 (K)
const SB=[[56000,'O'],[30000,'B'],[10000,'A'],[7500,'F'],[6000,'G'],[5200,'K'],[3700,'M'],[2400,'']];

function draw(){sv.innerHTML='';
 const d=el('defs',{});el('rect',{x:X0,y:Y0,width:X1-X0,height:Y1-Y0},el('clipPath',{id:'pa'},d));
 // 격자: 왼쪽 절대등급, 오른쪽 광도
 for(let m=15;m>=-10;m-=5){const y=yOf((MSUN-m)/2.5);el('line',{x1:X0,x2:X1,y1:y,y2:y,stroke:'#2a3156'});lab(X0-8,y+5,(m>0?'+':m<0?'−':'')+Math.abs(m),15,'end')}
 for(let p=-4;p<=6;p+=2){const y=yOf(p);el('line',{x1:X1,x2:X1+6,y1:y,y2:y,stroke:'#6a72a0'});lab(X1+10,y+5,(10**p).toLocaleString('ko-KR',{maximumFractionDigits:4}),13,'start')}
 lab(10,Y0-14,'절대등급',16,'start','#e8eaf2',700);lab(890,Y0-14,'광도 (태양 = 1)',16,'end','#e8eaf2',700);
 // 가로축: 분광형과 표면 온도
 SB.forEach(([T],i)=>{if(i==0||i==SB.length-1)return;const x=xOf(lg(T));el('line',{x1:x,x2:x,y1:Y0,y2:Y1,stroke:'#2a3156','stroke-dasharray':'4 5'})});
 for(let i=0;i<SB.length-1;i++){const x=(xOf(lg(SB[i][0]))+xOf(lg(SB[i+1][0])))/2;lab(x,Y1+24,SB[i][1],18,'middle','#e8eaf2',800)}
 [40000,20000,10000,5000,3000].forEach(T=>{const x=xOf(lg(T));el('line',{x1:x,x2:x,y1:Y1,y2:Y1+5,stroke:'#6a72a0'});lab(x,Y1+48,T.toLocaleString('ko-KR')+' K',13)});
 lab((X0+X1)/2,Y1+78,'분광형 (표면 온도)',16,'middle','#e8eaf2',700);lab(X0,Y1+78,'← 고온',13,'start');lab(X1,Y1+78,'저온 →',13,'end');
 el('rect',{x:X0,y:Y0,width:X1-X0,height:Y1-Y0,fill:'none',stroke:'#4a5280'});
 // 반지름이 같은 선: L = R²T⁴ (태양 = 1)
 if(rad.checked)[.01,.1,1,10,100,1000].forEach(R=>{const L=t=>2*lg(R)+4*(t-TSUN),pts=[];for(let t=TA;t>=TB;t-=.05)pts.push(xOf(t)+','+yOf(L(t)));
  el('polyline',{points:pts.join(' '),fill:'none',stroke:'#9aa3c7','stroke-width':1.2,'stroke-dasharray':'2 5','clip-path':'url(#pa)'});
  // 이름표: 선이 그림판 위쪽 끝(또는 왼쪽 끝)에 닿는 곳
  const t0=TSUN+(LA-.35-2*lg(R))/4,left=t0>=TA,tl=Math.max(TB+.02,Math.min(TA,t0)),yl=yOf(L(tl));
  if(yl>Y0+8&&yl<Y1-4)lab(left?X0+6:xOf(tl)-4,left?yl-6:yl+4,R.toLocaleString('ko-KR')+' R☉',12,left?'start':'end','#c3cae6')});
 // 무리 영역
 const show=G=='all'?Object.keys(GR):[G];
 show.forEach(k=>el('polygon',{'clip-path':'url(#pa)',points:REG[k].map(([t,l])=>xOf(t)+','+yOf(l)).join(' '),fill:GR[k].c,'fill-opacity':G=='all'?.1:.18,stroke:GR[k].c,'stroke-width':2,'stroke-dasharray':'6 5','stroke-linejoin':'round'}));
 // 일반적인 별들
 PTS.forEach(([t,l,g])=>{const x=xOf(t),y=yOf(l);if(x<X0||x>X1||y<Y0||y>Y1)return;el('circle',{cx:x,cy:y,r:2.3,fill:col(t),opacity:G=='all'||G==g?.88:.15})});
 show.forEach(k=>{const[t,l]=RL[k];lab(xOf(t),yOf(l),GR[k].n,19,'middle',GR[k].c,800)});
 // 대표적인 별: 고른 무리의 별만 이름을 붙임
 ST.forEach(([n,T,L,g,lf])=>{const x=xOf(lg(T)),y=yOf(lg(L)),on=G==g;
  el('circle',{cx:x,cy:y,r:on?6:4.5,fill:col(lg(T)),stroke:on?'#f5b942':'#fff','stroke-width':on?2.5:1.3,opacity:G=='all'||on?1:.3});
  if(on){const r=lf||x>X1-140;lab(x+(r?-12:12),y-9,n,15,r?'end':'start','#fff',800)}})}

// 무리 고르기
const T=document.getElementById('tabs');
[['all','전체 보기']].concat(Object.keys(GR).map(k=>[k,GR[k].n])).forEach(([k,n])=>{const b=document.createElement('button');b.dataset.k=k;
 b.innerHTML=(k=='all'?'':`<i style="background:${GR[k].c}"></i>`)+n;b.onclick=()=>setG(k);T.appendChild(b)});
function setG(k){G=k;T.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));
 note.innerHTML=k=='all'?`<div class="nh">H-R 도 상의 별의 분류</div><p>${ALL}</p>${ASK}`:`<div class="nh">${GR[k].n}</div><p>${GR[k].d}</p><p class="ex">대표적인 별: ${GR[k].ex}</p>`;
 note.classList.remove('enter');void note.offsetWidth;note.classList.add('enter');draw()}
rad.onchange=draw;
setG('all');
</script></main></body></html>
